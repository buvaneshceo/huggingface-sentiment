<!DOCTYPE html>
<html>
<head>
    <title>AI Sentiment Analysis</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hugging Face Sentiment Analysis</h1>

    <form method="POST">

        <textarea
            name="text"
            placeholder="Enter your text here..."
            required>{{ text or "" }}</textarea>

        <br>

        <button type="submit">
            Analyze Sentiment
        </button>

    </form>


    {% if sentiment %}

    <div class="result">

        <h2>AI Prediction</h2>

        <p>
            <strong>Text:</strong>
            {{ text }}
        </p>

        <p>
            <strong>Sentiment:</strong>
            {{ sentiment }}
        </p>

        <p>
            <strong>Confidence:</strong>
            {{ confidence }}
        </p>

    </div>

    {% endif %}

</div>

</body>
</html>
